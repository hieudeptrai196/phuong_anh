  <style>
    :root {
      --paper: #f3eee8;
      --ink: #28251f;
      --peach: #ead1c2;
      --muted: rgba(40, 37, 31, .6);
      --rule: rgba(40, 37, 31, .2);
      --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --sans: 'Be Vietnam Pro', Arial, Helvetica, sans-serif;
      --ease: cubic-bezier(.22, .75, .25, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--ink); }
    body {
      font-family: var(--sans); -webkit-font-smoothing: antialiased;
      min-height: 100svh; display: grid; place-items: center; align-content: center; gap: 26px;
      padding: max(28px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    }
    .label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }

    /* Ticket: main body + stub, joined by a perforation with notches cut from both sides. */
    .ticket {
      width: min(420px, 100%); aspect-ratio: 4 / 5; container-type: inline-size;
      display: grid; grid-template-rows: 1fr auto;
      filter: drop-shadow(0 30px 50px rgba(0, 0, 0, .45));
      animation: arrive 1.2s var(--ease) both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(24px) rotate(-1.5deg); } }
    .main, .stub {
      background: var(--paper);
      --notch: radial-gradient(circle 4.2cqw at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
               radial-gradient(circle 4.2cqw at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
    }
    .main {
      -webkit-mask: var(--notch); mask: var(--notch);
      padding: 7cqw 7cqw 6cqw; display: grid; grid-template-rows: auto auto 1fr auto; gap: 3cqw;
      border-radius: 1.5cqw 1.5cqw 0 0;
    }
    .stub {
      --notch: radial-gradient(circle 4.2cqw at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
               radial-gradient(circle 4.2cqw at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
      -webkit-mask: var(--notch); mask: var(--notch);
      padding: 6cqw 7cqw 6.5cqw; position: relative; border-radius: 0 0 1.5cqw 1.5cqw;
      background: var(--peach);
    }
    .stub::before { content: ''; position: absolute; top: 0; left: 6cqw; right: 6cqw; border-top: 1.5px dashed rgba(40, 37, 31, .45); }

    .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 2.3cqw; letter-spacing: .2em; text-transform: uppercase; }
    .top b { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 3.6cqw; letter-spacing: 0; text-transform: none; }
    .kind { font-size: 2.3cqw; letter-spacing: .32em; text-transform: uppercase; border-top: 1px solid var(--ink); padding-top: 3cqw; }
    .amount { align-self: center; display: grid; gap: 1cqw; }
    .amount .num { font-family: var(--serif); font-weight: 400; font-size: 19cqw; line-height: .9; letter-spacing: -.045em; font-variant-numeric: lining-nums; white-space: nowrap; }
    .amount .num sup { font-size: .32em; font-style: italic; letter-spacing: 0; vertical-align: top; margin-left: .08em; position: relative; top: .25em; }
    .amount .words { font-family: var(--serif); font-style: italic; font-size: 5cqw; letter-spacing: -.01em; color: var(--muted); }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw 4cqw; border-top: 1px solid var(--rule); padding-top: 3cqw; }
    .meta div { display: grid; gap: .8cqw; }
    .meta small { font-size: 1.9cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .meta span { font-family: var(--serif); font-size: 3.8cqw; letter-spacing: -.01em; }
    .meta div:nth-child(2) { text-align: right; }

    .stub-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 4cqw; }
    .claim { font-family: var(--serif); font-style: italic; font-size: 6.6cqw; line-height: 1.05; letter-spacing: -.02em; }
    .claim small { display: block; margin-top: 1.6cqw; font-family: var(--sans); font-style: normal; font-size: 2cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .code { text-align: right; font-size: 1.9cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .code b { display: block; margin-top: 1cqw; font-family: var(--serif); font-weight: 400; font-size: 4cqw; letter-spacing: .04em; color: var(--ink); }

    .actions { display: flex; gap: 18px; align-items: center; color: var(--paper); }
    .actions a { color: inherit; text-decoration: none; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; padding: 12px 18px; border: 1px solid rgba(243, 238, 232, .5); border-radius: 999px; }
    .actions a:active { transform: scale(.97); }

    /* Share row (logic in assets/share.js) */
    .share { display: flex; align-items: center; gap: 10px; color: var(--paper); }
    .share-label { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; opacity: .7; margin-right: 8px; }
    .share button { appearance: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(243, 238, 232, .4); background: transparent; color: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .3s, color .3s, border-color .3s, transform .3s var(--ease); }
    .share button:hover, .share button:focus-visible { background: var(--paper); color: var(--ink); border-color: var(--paper); outline: none; }
    .share button:active { transform: scale(.94); }
    .share svg { width: 15px; height: 15px; fill: currentColor; }
    .share [data-share="zalo"] svg { width: 22px; height: 22px; }
    .share-toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 10; transform: translate(-50%, 20px); max-width: calc(100vw - 32px); background: var(--paper); color: var(--ink); padding: 12px 18px; border-radius: 999px; font: 500 11px/1.4 var(--sans); letter-spacing: .04em; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); }
    .share-toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* ?render — a bare 4:5 ticket used to export voucher.png */
    .render .share { display: none; }
    .render body { padding: 0; place-items: stretch; background: var(--ink); }
    .render .ticket { width: 100%; height: 100%; aspect-ratio: auto; filter: none; animation: none; padding: 5%; }
    .render .actions { display: none; }
    @media (prefers-reduced-motion: reduce) { .ticket { animation: none; } }
  </style>
</head>

    <section class="stub">
      <div class="stub-row">
        <div class="claim">Vui lòng IB<br>để nhận quà.<small>Happy 22nd birthday</small></div>
        <div class="code">Voucher code<b>PA-22-3110</b></div>
      </div>
    </section>
  </main>
  <nav class="actions">
    <a href="assets/voucher.png" download="voucher-phuong-anh.png">Save voucher</a>
    <a href="index.html">Back to the issue</a>
  </nav>
  <div class="share" data-share-group data-share-path="voucher.html"
       data-share-image="assets/voucher.png"
       data-share-title="Gift Voucher — Phương Anh Nº22"
       data-share-text="1.000.000₫ birthday voucher. Vui lòng IB để nhận quà.">
    <span class="share-label">Share voucher</span>
    <button data-share="facebook"></button>
    <button data-share="instagram"></button>
    <button data-share="zalo"></button>
  </div>
  <script src="assets/share.js"></script>
</body>
</html>
